<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Software factory architecture: agentic cloud on AWS, execution cloud on GCP, GitHub as the seam</title>
  <desc id="desc">On AWS, the orchestrator leases one Jira ticket, publishes through an SNS and SQS bus, and the Builder (a Strands agent on gpt-oss) keeps specs, results and CI reports as claim checks in S3. The Builder opens a pull request on GitHub, which runs the CI factory on GCP with acceptance tests and the Policy Engine. GitHub returns the check result to a webhook ingress on AWS. The owner approves every merge on GitHub. On GCP, Genesis governs guardrails for both clouds, an OTLP collector receives telemetry, the compliance authority signs evidence and tokens, and the apply pipeline ships services. Agents hold no execution-plane identity, and only CI-signed results count as evidence.</desc>
  <style>
    .bg { fill: #15181d; }
    .frame { fill: none; stroke: #3a3f47; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .aws { fill: #3c3489; stroke: #7f77dd; stroke-width: 1; }
    .gcp { fill: #085041; stroke: #1d9e75; stroke-width: 1; }
    .mid { fill: #3a3a38; stroke: #888780; stroke-width: 1; }
    .you { fill: #633806; stroke: #ef9f27; stroke-width: 1; }
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h { fill: #f1efe8; font-size: 20px; font-weight: 600; }
    .cap { fill: #b4b2a9; font-size: 15px; }
    .t-aws { fill: #eeedfe; font-size: 18px; font-weight: 600; }
    .s-aws { fill: #cecbf6; font-size: 14px; }
    .t-gcp { fill: #e1f5ee; font-size: 18px; font-weight: 600; }
    .s-gcp { fill: #9fe1cb; font-size: 14px; }
    .t-mid { fill: #f1efe8; font-size: 18px; font-weight: 600; }
    .s-mid { fill: #d3d1c7; font-size: 14px; }
    .t-you { fill: #faeeda; font-size: 18px; font-weight: 600; }
    .s-you { fill: #fac775; font-size: 14px; }
    .flow { fill: #d3d1c7; font-size: 13px; }
    .flow b { fill: #fac775; }
    .note { fill: #d3d1c7; font-size: 15px; }
    .arr { stroke: #b4b2a9; stroke-width: 1.5; fill: none; }
    .claim { stroke: #afa9ec; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .tele { stroke: #888780; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b4b2a9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#afa9ec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ef9f27" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="640"/>
  <rect class="frame" x="20" y="20" width="340" height="510" rx="18"/>
  <rect class="frame" x="640" y="20" width="340" height="510" rx="18"/>

  <text class="h" x="40" y="54">Agentic cloud · AWS</text>
  <text class="cap" x="40" y="74">reasons, proposes, builds</text>
  <text class="h" x="500" y="54" text-anchor="middle">Seam</text>
  <text class="cap" x="500" y="74" text-anchor="middle">GitHub decides what passes</text>
  <text class="h" x="660" y="54">Execution cloud · GCP</text>
  <text class="cap" x="660" y="74">evaluates, certifies, ships</text>

  <!-- AWS -->
  <rect class="aws" x="40" y="96" width="300" height="64" rx="10"/>
  <text class="t-aws" x="190" y="123" text-anchor="middle">Orchestrator</text>
  <text class="s-aws" x="190" y="145" text-anchor="middle">Lambda · fenced lease + outbox</text>

  <rect class="aws" x="40" y="186" width="300" height="64" rx="10"/>
  <text class="t-aws" x="190" y="213" text-anchor="middle">SNS / SQS bus</text>
  <text class="s-aws" x="190" y="235" text-anchor="middle">events · claim checks · DLQs</text>

  <rect class="aws" x="40" y="276" width="300" height="64" rx="10"/>
  <text class="t-aws" x="190" y="303" text-anchor="middle">Builder</text>
  <text class="s-aws" x="190" y="325" text-anchor="middle">Strands · gpt-oss · spot, scales to zero</text>

  <rect class="aws" x="40" y="366" width="300" height="64" rx="10"/>
  <text class="t-aws" x="190" y="393" text-anchor="middle">S3 claim checks</text>
  <text class="s-aws" x="190" y="415" text-anchor="middle">spec · result · CI report, by SHA-256</text>

  <rect class="aws" x="40" y="456" width="300" height="64" rx="10"/>
  <text class="t-aws" x="190" y="483" text-anchor="middle">CI webhook ingress</text>
  <text class="s-aws" x="190" y="505" text-anchor="middle">verifies signature, re-reads result</text>

  <!-- Seam -->
  <rect class="mid" x="400" y="96" width="200" height="64" rx="10"/>
  <text class="t-mid" x="500" y="123" text-anchor="middle">Jira</text>
  <text class="s-mid" x="500" y="145" text-anchor="middle">tickets · no authority</text>

  <rect class="mid" x="400" y="276" width="200" height="64" rx="10"/>
  <text class="t-mid" x="500" y="303" text-anchor="middle">GitHub</text>
  <text class="s-mid" x="500" y="325" text-anchor="middle">PR · required checks</text>

  <rect class="you" x="440" y="436" width="160" height="64" rx="10"/>
  <text class="t-you" x="520" y="463" text-anchor="middle">Owner</text>
  <text class="s-you" x="520" y="485" text-anchor="middle">approves every merge</text>

  <!-- GCP -->
  <rect class="gcp" x="660" y="96" width="300" height="64" rx="10"/>
  <text class="t-gcp" x="810" y="123" text-anchor="middle">Genesis</text>
  <text class="s-gcp" x="810" y="145" text-anchor="middle">guardrails for both clouds</text>

  <rect class="gcp" x="660" y="186" width="300" height="64" rx="10"/>
  <text class="t-gcp" x="810" y="213" text-anchor="middle">OTLP collector</text>
  <text class="s-gcp" x="810" y="235" text-anchor="middle">traces · metrics · logs</text>

  <rect class="gcp" x="660" y="276" width="300" height="64" rx="10"/>
  <text class="t-gcp" x="810" y="303" text-anchor="middle">CI factory</text>
  <text class="s-gcp" x="810" y="325" text-anchor="middle">acceptance tests · Policy Engine</text>

  <rect class="gcp" x="660" y="366" width="300" height="64" rx="10"/>
  <text class="t-gcp" x="810" y="393" text-anchor="middle">Compliance authority</text>
  <text class="s-gcp" x="810" y="415" text-anchor="middle">CI-signed evidence · release tokens</text>

  <rect class="gcp" x="660" y="456" width="300" height="64" rx="10"/>
  <text class="t-gcp" x="810" y="483" text-anchor="middle">Apply · services</text>
  <text class="s-gcp" x="810" y="505" text-anchor="middle">own identity · deployment guard</text>

  <!-- AWS internal -->
  <line class="arr" x1="190" y1="162" x2="190" y2="184" marker-end="url(#a)"/>
  <line class="arr" x1="190" y1="252" x2="190" y2="274" marker-end="url(#a)"/>
  <line class="claim" x1="190" y1="342" x2="190" y2="364" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <line class="claim" x1="190" y1="454" x2="190" y2="432" marker-end="url(#ac)"/>
  <path class="arr" d="M 40 488 L 30 488 L 30 218 L 38 218" marker-end="url(#a)"/>

  <!-- 4 coordination -->
  <line class="arr" x1="342" y1="128" x2="398" y2="128" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="flow" x="500" y="180" text-anchor="middle"><tspan style="fill:#fac775">4</tspan> coordination</text>

  <!-- 3 observability -->
  <line class="tele" x1="342" y1="218" x2="658" y2="218" marker-end="url(#a)"/>
  <text class="flow" x="500" y="208" text-anchor="middle"><tspan style="fill:#fac775">3</tspan> observability · send-only</text>

  <!-- 1 change -->
  <line class="arr" x1="342" y1="308" x2="398" y2="308" marker-end="url(#a)"/>
  <line class="arr" x1="602" y1="308" x2="658" y2="308" marker-end="url(#a)"/>
  <text class="flow" x="500" y="266" text-anchor="middle"><tspan style="fill:#fac775">1</tspan> change</text>

  <!-- 2 verification -->
  <path class="arr" d="M 415 342 L 415 488 L 342 488" marker-end="url(#a)"/>
  <text class="flow" x="378" y="410" text-anchor="middle"><tspan style="fill:#fac775">2</tspan> verify</text>

  <!-- owner approval -->
  <line x1="520" y1="434" x2="520" y2="342" stroke="#ef9f27" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <text class="flow" x="528" y="392">approval</text>

  <line class="arr" x1="810" y1="342" x2="810" y2="364" marker-end="url(#a)"/>
  <line class="arr" x1="810" y1="432" x2="810" y2="454" marker-end="url(#a)"/>

  <text class="note" x="500" y="572" text-anchor="middle">Agents hold no execution-plane identity: they reach GCP only through a pull request.</text>
  <text class="note" x="500" y="598" text-anchor="middle">Only CI-signed results are evidence; anything an agent reports stays a claim.</text>
</svg>
